name: Docker

on:
  push:
    branches: [main, fixed-branch]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eventrentlast-backend
            file: Dockerfile.backend
          - name: eventrentlast-frontend
            file: Dockerfile.frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer redeploy (backend)
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_BACKEND }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL"
            echo "Backend redeploy triggered"
          else
            echo "PORTAINER_WEBHOOK_BACKEND not set, skipping"
          fi

      - name: Trigger Portainer redeploy (frontend)
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL"
            echo "Frontend redeploy triggered"
          else
            echo "PORTAINER_WEBHOOK_FRONTEND not set, skipping"
          fi
