services:
  yenievent-backend:
    image: yenievent-backend:latest
    restart: unless-stopped
    environment:
      PORT: "4320"
      PUBLIC_BASE_URL: ""
    volumes:
      - /datastore/yenievent/uploads:/app/uploads
      - /datastore/yenievent/app/data:/app/data
    networks:
      - edge
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=edge'
      - 'traefik.http.routers.yenievent-api.rule=Host(`eventrent.octotech.az`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))'
      - 'traefik.http.routers.yenievent-api.entrypoints=web'
      - 'traefik.http.routers.yenievent-api.priority=100'
      - 'traefik.http.services.yenievent-api.loadbalancer.server.port=4320'

  yenievent-frontend:
    image: yenievent-frontend:latest
    restart: unless-stopped
    networks:
      - edge
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=edge'
      - 'traefik.http.routers.yenievent.rule=Host(`eventrent.octotech.az`)'
      - 'traefik.http.routers.yenievent.entrypoints=web'
      - 'traefik.http.services.yenievent.loadbalancer.server.port=80'

networks:
  edge:
    external: true
